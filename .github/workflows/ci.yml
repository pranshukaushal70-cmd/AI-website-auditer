# Runs every existing test suite plus the offline detector evaluation.
# Nothing here needs network access beyond installing pinned dependencies, and no secrets are used.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  engine:
    name: engine suites + verifier + evaluation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The engine is standard-library only; no install step is needed.
      - run: python tests/test_all_rubric_cases.py
      - run: python tests/test_round3_polish.py
      - run: python tests/test_engine_fixes.py
      - run: python verify_marketplace.py
      - run: python evaluation/test_evaluation.py
      - name: Detector evaluation must reproduce the committed results
        run: python evaluation/run_evaluation.py --check

  backend:
    name: backend pytest + ruff
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m ruff check backend evaluation
      - run: python -m pytest -q -p no:cacheprovider
        working-directory: backend

  frontend:
    name: frontend typecheck + tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
